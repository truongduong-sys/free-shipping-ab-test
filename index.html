<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무료 배송 A/B 테스트</title><style>
:root{--y:#ffd530;--ink:#202124;--muted:#667085;--line:#e5e7eb;--bg:#fffdf5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}header{padding:22px 5vw;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.logo{font-weight:800;font-size:20px}.tag{background:var(--y);padding:7px 12px;border-radius:20px;font-size:13px;font-weight:700}main{max-width:980px;margin:42px auto;padding:0 20px}.hero{text-align:center;margin-bottom:28px}.hero h1{font-size:clamp(28px,5vw,44px);margin:0 0 12px}.hero p,.desc{color:var(--muted);line-height:1.7}.product{display:grid;grid-template-columns:1fr 1fr;gap:28px;background:white;border:1px solid var(--line);border-radius:22px;padding:28px;align-items:center}.visual{height:280px;border-radius:18px;background:linear-gradient(135deg,#fff2b8,#fff9e5);display:flex;align-items:center;justify-content:center;font-size:100px}.info h2{font-size:26px}.price{font-size:32px;font-weight:800;margin:20px 0 6px}.shipping{font-size:16px;color:#b77900;font-weight:700}.cta{width:100%;border:0;border-radius:12px;background:var(--y);padding:16px;font-size:18px;font-weight:800;cursor:pointer;margin-top:22px}.survey{margin-top:28px;background:white;border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center}.survey p{color:var(--muted)}.ratings{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.rating{border:1px solid var(--line);background:white;border-radius:9px;width:44px;height:44px;font-weight:700;cursor:pointer}.rating:hover,.rating.selected{background:var(--y);border-color:var(--y)}#feedback{margin-top:14px;font-weight:700;color:#167044;min-height:22px}footer{text-align:center;color:var(--muted);font-size:12px;padding:30px}@media(max-width:700px){.product{grid-template-columns:1fr;padding:18px}.visual{height:200px}}
</style><!-- VWO SmartCode: paste your account-specific SmartCode here --></head><body><header><div class="logo">🛍️ MY SHOP</div><span class="tag">연구용 테스트 페이지</span></header><main><section class="hero"><h1>일상에 필요한 작은 아이템</h1><p>가격 표현 방식에 따른 구매 의도 실험에 참여해 주세요.</p></section><section class="product"><div class="visual">🎧</div><div class="info"><span class="tag">BEST ITEM</span><h2>무선 이어폰</h2><p class="desc">깔끔한 디자인과 편리한 사용성을 갖춘 데일리 아이템입니다.<br>※ 연구용 가상 상품이며 실제 판매하지 않습니다.</p><div class="price" id="price">12,500원</div><div class="shipping" id="shipping">무료 배송</div><button class="cta" id="buyButton">구매하기</button></div></section><section class="survey"><h3>이 상품을 구매하고 싶은 정도는 어느 정도인가요?</h3><p>1점(전혀 구매하고 싶지 않다) ~ 7점(매우 구매하고 싶다)</p><div class="ratings"><button class="rating" data-score="1">1</button><button class="rating" data-score="2">2</button><button class="rating" data-score="3">3</button><button class="rating" data-score="4">4</button><button class="rating" data-score="5">5</button><button class="rating" data-score="6">6</button><button class="rating" data-score="7">7</button></div><div id="feedback"></div></section></main><footer>연구·수업 프로젝트용 데모 | 실제 결제 또는 개인정보 수집 없음</footer><script>
const variant=(new URLSearchParams(location.search).get("variant")||"B").toUpperCase();if(variant==="A"){price.textContent="10,000원";shipping.textContent="+ 배송비 2,500원"}else{price.textContent="12,500원";shipping.textContent="무료 배송"}document.body.dataset.variant=variant;
document.querySelectorAll("[data-score]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-score]").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");let score=+b.dataset.score;feedback.textContent=`응답 감사합니다. 선택한 점수: ${score}점`;window.dataLayer=window.dataLayer||[];dataLayer.push({event:"purchase_intent_score",score,variant})}));
buyButton.addEventListener("click",()=>{feedback.textContent="구매 의도 버튼 클릭이 기록되었습니다. (실제 결제 없음)";window.dataLayer=window.dataLayer||[];dataLayer.push({event:"purchase_intent_click",variant})});
</script></body></html>
